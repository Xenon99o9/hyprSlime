#  HYPRSLIME — Great Sage System Interface (hyprland.conf)
#  Theme: Tensei Shitara Slime Datta Ken (Rimuru / Great Sage HUD)
# ══════════════════════════════════════════════════════════════════════════════

# 1. Hardware & System Environment
source = ~/.config/hypr/conf/monitors.conf      # Display configuration
source = ~/.config/hypr/conf/env.conf           # Wayland & GPU environment variables
source = ~/.config/hypr/conf/programs.conf      # Default applications ($terminal, $menu...)
source = ~/.config/hypr/conf/autostart.conf     # Daemons & startup services (exec-once)

# 2. Great Sage Aesthetics ("Look & Feel")
source = ~/.config/hypr/conf/colors.conf        # Rimuru & Great Sage color palette
source = ~/.config/hypr/conf/general.conf       # Gaps, HUD borders, layout
source = ~/.config/hypr/conf/decoration.conf    # Holographic blur, glow/shadow, opacity
source = ~/.config/hypr/conf/animations.conf    # Snappy / fluid UI transitions

# 3. Controls & Window Management
source = ~/.config/hypr/conf/input.conf         # Keyboard, mouse & trackpad
source = ~/.config/hypr/conf/keybinds.conf      # Keybindings
source = ~/.config/hypr/conf/special.conf       # Caelestia Special Workspaces (Music, Btop, Chat, Browser)
source = ~/.config/hypr/conf/windowrules.conf   # Window & layer rules (blur on HUDs)

