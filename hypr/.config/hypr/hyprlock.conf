# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Great Sage / Raphael Custom Lock Screen (hyprlock.conf)
#  Keybind: Super + L  |  Theme: Ultimate Skill [Uriel / Raphael] Barrier
# ══════════════════════════════════════════════════════════════════════════════

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    grace = 2
}

animations {
    enabled = true
    bezier = sageCurve, 0.16, 1.0, 0.3, 1.0
    animation = fadeIn, 1, 4, sageCurve
    animation = fadeOut, 1, 3, sageCurve
    animation = inputFieldDots, 1, 2, sageCurve
}

# ─── 1. Great Sage Prismatic Octagonal HUD Background ─────────────────────────
background {
    monitor =
    path = $HOME/.config/hypr/wallpapers/great-sage-lockscreen.png
    color = rgba(060a12ff)
    blur_passes = 0
}

# ─── 2. Top Octagonal Banner Header ───────────────────────────────────────────
label {
    monitor =
    text = ◈ « REPORT: ULTIMATE SKILL [URIEL] DEFENSIVE BARRIER ENGAGED »
    color = rgba(ffd54fff)
    font_size = 13
    font_family = $font
    position = 0, 420
    halign = center
    valign = center
}

# ─── 3. Great Sage Digital Chronometer (Time & Date) ──────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(e8f4ffff)
    font_size = 64
    font_family = $font
    position = 0, 268
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"◈ %A %d %B %Y  //  RAPHAEL OS"
    color = rgba(00e5ffff)
    font_size = 13
    font_family = $font
    position = 0, 195
    halign = center
    valign = center
}

# ─── 4. Central Rimuru Tempest Emblem inside Octagram Seal ────────────────────
image {
    monitor =
    path = $HOME/.config/hypr/wallpapers/rimuru-avatar.png
    size = 132
    rounding = -1
    border_size = 2
    border_color = rgba(00e5ffee)
    position = 0, 20
    halign = center
    valign = center
}

# ─── 5. User Identity & Authentication Matrix ─────────────────────────────────
label {
    monitor =
    text = ◈ CHANCELLOR: $USER  //  JURA TEMPEST FEDERATION
    color = rgba(ffd54fff)
    font_size = 12
    font_family = $font
    position = 0, -148
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 440, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.30
    dots_center = true
    rounding = 8

    outer_color = rgba(00e5ffee) rgba(ffd54fee) 45deg
    inner_color = rgba(070b14e6)
    font_color = rgb(232, 244, 255)
    check_color = rgba(ffd54fee) rgba(00e676ee) 45deg
    fail_color = rgba(ff5252ee) rgba(b388ffee) 45deg
    capslock_color = rgba(ffd54fee)
    numlock_color = rgba(00e5ffee)
    bothlock_color = rgba(ff5252ee)

    fade_on_empty = false
    font_family = $font
    placeholder_text = <i>◈ Enter Passcode (Active Layout shown below)...</i>
    fail_text = <b>◈ « AUTHENTICATION FAILED ($ATTEMPTS/3) — VERIFY KEYBOARD LAYOUT BELOW »</b>

    position = 0, -215
    halign = center
    valign = center
}

label {
    monitor =
    text = ◈ KEYBOARD LAYOUT: [ $LAYOUT ]  •  CLICK HERE OR PRESS ALT+SHIFT TO SWITCH (FR / US)
    color = rgba(ffd54fff)
    font_size = 11
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -295
    halign = center
    valign = center
}

# ─── 6. Bottom Telemetry Pill (Battery, Uptime & Status) ──────────────────────
label {
    monitor =
    text = cmd[update:5000] bash -c 'bat=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1 || echo "100"); st=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1 || echo "AC"); up=$(uptime -p | sed "s/up //"); echo "◈ MAGICULE CELL: ${bat}% (${st})   //   UPTIME: ${up}"'
    color = rgba(00e5ffff)
    font_size = 11
    font_family = $font
    position = 0, -446
    halign = center
    valign = center
}

