# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Input & Gestures (input.conf)
#  Note: Keyboard layouts (kb_layout) are customizable during installation
#  or live via the Great Sage Menu (Super + Shift + G)
# ══════════════════════════════════════════════════════════════════════════════

input {
    # Default French AZERTY; supports comma-separated multi-layout (e.g., "fr,us")
    kb_layout = fr
    kb_variant =
    kb_model =
    # Switch between multiple configured layouts using Alt + Shift
    kb_options = grp:alt_shift_toggle
    kb_rules =

    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
}

