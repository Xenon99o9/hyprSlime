# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Keybindings (keybinds.conf)
#  Universal AZERTY / QWERTY compatibility using physical keycodes for numbers
# ══════════════════════════════════════════════════════════════════════════════

$mainMod = SUPER

# ─── Core Applications ────────────────────────────────────────────────────────
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, R, exec, $menu
bind = $mainMod, Space, exec, $menu

# ─── Great Sage HUD & Customization Menu ──────────────────────────────────────
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/great-sage-menu.sh
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Great Sage Memory" | cliphist decode | wl-copy
bind = $mainMod, L, exec, $lock

# ─── Window Management (Caelestia / end-4 Ergonomics) ─────────────────────────
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, P, pseudo,          # Dwindle pseudotile
bind = $mainMod, J, togglesplit,     # Dwindle split direction

# ─── Screenshots (Grim + Slurp + Swappy / Clipboard) ──────────────────────────
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# ─── Focus Navigation (Arrows + Vim Keys) ─────────────────────────────────────
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ─── Move Windows Within Workspace ────────────────────────────────────────────
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ─── Resize Active Window ─────────────────────────────────────────────────────
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# ─── Workspaces 1-10 (Physical Keycodes: Works on both AZERTY & QWERTY!) ──────
# code:10 = 1/& | code:11 = 2/é | code:12 = 3/" | code:13 = 4/' | code:14 = 5/(
# code:15 = 6/- | code:16 = 7/è | code:17 = 8/_ | code:18 = 9/ç | code:19 = 0/à
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# ─── Move Active Window to Workspace 1-10 ─────────────────────────────────────
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# ─── Special Workspace ("Stomach / Predator" Scratchpad) ──────────────────────
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ─── Mouse Bindings & Scroll Workspaces ───────────────────────────────────────
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ─── Hardware Media & Brightness Keys (Laptop & Desktop) ──────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

