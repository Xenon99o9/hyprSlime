# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Environment Variables (env.conf)
# ══════════════════════════════════════════════════════════════════════════════

# ─── Cursor & Sizing ──────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─── Wayland Backends (Universal across Intel / AMD / NVIDIA) ─────────────────
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ─── XDG Desktop Portal Specifications ────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ─── Qt6 & Quickshell Integration (Great Sage HUD) ────────────────────────────
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# ─── Hardware-Specific GPU Profile (Auto-configured by install script) ────────
# Keep GPU-specific variables (VA-API / NVIDIA DRM) isolated in hardware.conf
# so the base repository works out-of-the-box on any AMD, Intel, or NVIDIA machine.
source = ~/.config/hypr/conf/hardware.conf

