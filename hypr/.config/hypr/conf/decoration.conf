# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Holographic HUD Decorations (decoration.conf)
# ══════════════════════════════════════════════════════════════════════════════

decoration {
    # Geometric Great Sage aesthetic (6px sharp-modern corners)
    rounding = 6

    # Window Opacity (Subtle holographic transparency; overridden to 1.0 for video/media in windowrules)
    active_opacity = 0.96
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    # Neon Magicule Bloom (Colored Shadow on active window)
    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = $slime_glow
        color_inactive = rgba(00000044)
    }

    # Great Sage Frosted Glass Blur
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = true
        noise = 0.015
        contrast = 1.05
        brightness = 1.05
        vibrancy = 0.25
        vibrancy_darkness = 0.1
        special = true
    }
}

