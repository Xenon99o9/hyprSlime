# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Display Configuration (monitors.conf)
# ══════════════════════════════════════════════════════════════════════════════
# Syntax: monitor = name, resolution@hz, position, scale
#
# Universal portable rule: automatically detects any connected monitor
# (laptop eDP-1, desktop DP/HDMI) at its native resolution and highest refresh rate.
monitor = , highrr, auto, 1

# Example overrides for multi-monitor desktop setups (configured via installer or hyprctl):
# monitor = DP-1, 2560x1440@165, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@144, 2560x0, 1

