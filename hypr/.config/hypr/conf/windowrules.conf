# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Window & Layer Rules (windowrules.conf)
# ══════════════════════════════════════════════════════════════════════════════

# ─── Prevent Maximize Events from Breaking Tiling Layout ──────────────────────
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# ─── Media, Browsers & Video Players (Force 1.0 Opacity for Crisp Visuals) ────
windowrulev2 = opacity 1.0 override 1.0 override, class:^(brave-browser|firefox|zen|mpv|vlc|obs)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*YouTube.*|.*Twitch.*|.*Picture-in-Picture.*)$

# ─── Picture-in-Picture (Floating HUD Corner Window) ──────────────────────────
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 30% 30%, title:^(Picture-in-Picture)$
windowrulev2 = move 68% 67%, title:^(Picture-in-Picture)$

# ─── Floating Utility Dialogs ("Great Sage Analysis Popups") ──────────────────
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol|pavucontrol|nm-connection-editor|blueman-manager|qt6ct)$
windowrulev2 = size 750 500, class:^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager)$
windowrulev2 = center, class:^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager)$

# ─── File Picker & Authentication Dialogs ─────────────────────────────────────
windowrulev2 = float, title:^(Open File|Save File|Select a File|Choose Wallpaper|Confirm to replace files)$
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1)$

# ─── Holographic Blur on Shell Layers (Quickshell & Rofi) ─────────────────────
layerrule = blur, quickshell
layerrule = ignorezero, quickshell
layerrule = blur, rofi
layerrule = ignorezero, rofi

