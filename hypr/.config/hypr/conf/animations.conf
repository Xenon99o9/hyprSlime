# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Slime Fluidity & Great Sage Precision (animations.conf)
# ══════════════════════════════════════════════════════════════════════════════

animations {
    enabled = true

    # ─── Custom Bezier Curves ─────────────────────────────────────────────────
    # "greatSage": Ultra-fast geometric snap (inspired by caelestia / end-4)
    bezier = greatSage, 0.05, 0.9, 0.1, 1.0
    # "slimeBounce": Organic slight overshoot (1.06) like Rimuru bouncing
    bezier = slimeBounce, 0.15, 0.85, 0.25, 1.06
    # "magiculeFlow": Smooth linear curve for continuous border rotation
    bezier = magiculeFlow, 0.0, 0.0, 1.0, 1.0

    # ─── Window Animations ────────────────────────────────────────────────────
    animation = windowsIn, 1, 4, slimeBounce, popin 80%
    animation = windowsOut, 1, 3, greatSage, popin 85%
    animation = windowsMove, 1, 4, slimeBounce, slide

    # ─── Layers (Quickshell HUD panels, Rofi, Notifications) ──────────────────
    animation = layersIn, 1, 3, greatSage, popin 90%
    animation = layersOut, 1, 2, greatSage, fade
    animation = fade, 1, 3, greatSage

    # ─── Magicule Border Animation (Toggleable via Great Sage Menu) ───────────
    # Default: static angle transition on focus change (0% idle GPU usage)
    # To enable continuous flowing magicules, set borderangle loop to 1 via menu:
    animation = border, 1, 5, greatSage
    animation = borderangle, 0, 45, magiculeFlow, loop

    # ─── Workspaces ───────────────────────────────────────────────────────────
    animation = workspaces, 1, 5, greatSage, slidefade 15%
    animation = specialWorkspace, 1, 4, slimeBounce, slidefadevert -20%
}

