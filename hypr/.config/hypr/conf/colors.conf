# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Great Sage & Rimuru Color Palette (colors.conf)
#  Supports dynamic switching via the Great Sage Customization Menu
# ══════════════════════════════════════════════════════════════════════════════

# ─── Abyssal Mindscape (Backgrounds & Surfaces) ───────────────────────────────
$bg_void          = rgba(080c14ee)   # Deep Mindscape Void (93% opacity)
$bg_surface       = rgba(0f1726cc)   # Holographic Panel Surface (80% opacity)
$bg_inactive      = rgba(1c294266)   # Dormant Magicule Frame

# ─── Rimuru & Magicule Blues (Primary Accents) ────────────────────────────────
$slime_cyan       = rgba(00e5ffff)   # Bright Magicule Cyan (#00e5ff)
$slime_azure      = rgba(2979ffff)   # Rimuru Core Azure (#2979ff)
$slime_ice        = rgba(84ffffcc)   # Great Sage Ice Highlight (#84ffff)

# ─── Great Sage & Skills (Secondary Accents) ──────────────────────────────────
$sage_gold        = rgba(ffd54fff)   # Golden Eye / Unique Skill Runes (#ffd54f)
$gluttony_purple  = rgba(b388ffff)   # Beelzebub / Void Purple (#b388ff)
$danger_crimson   = rgba(ff5252ff)   # Benimaru / Warning Alert (#ff5252)

# ─── Border Presets (Selectable via Installer or Live Theme Menu) ─────────────
# [Preset 1] Unique Skill: Great Sage (Cyan -> Azure -> Golden Eye)
$border_great_sage = $slime_cyan $slime_azure $sage_gold 45deg
$glow_great_sage   = rgba(00e5ff55)

# [Preset 2] Slime Core: Pure Magicule (Cyan -> Azure -> Ice)
$border_magicule   = $slime_cyan $slime_azure $slime_ice 45deg
$glow_magicule     = rgba(2979ff55)

# [Preset 3] Ultimate Skill: Beelzebub (Cyan -> Azure -> Void Purple)
$border_beelzebub  = $slime_cyan $slime_azure $gluttony_purple 45deg
$glow_beelzebub    = rgba(b388ff55)

# [Preset 4] Demon Lord: Hellflare (Crimson -> Gold)
$border_hellflare  = $danger_crimson $sage_gold $danger_crimson 45deg
$glow_hellflare    = rgba(ff525255)

# ─── Primordial Demons Presets (Recruited by Rimuru) ──────────────────────────
# [Preset 5] Primordial Noir: Diablo (Crimson -> Void Black -> Gold)
$border_diablo     = rgba(e53935ff) rgba(0f1726ff) rgba(ffd54fff) 45deg
$glow_diablo       = rgba(e5393555)

# [Preset 6] Primordial Blanc: Testarossa (White -> Crimson Ruby -> Silver)
$border_testarossa = rgba(ffffffff) rgba(ef4444ff) rgba(cbd5e1ff) 45deg
$glow_testarossa   = rgba(ffffff55)

# [Preset 7] Primordial Jaune: Carrera (Solar Gold -> Amber -> Imperial Violet)
$border_carrera    = rgba(fbbf24ff) rgba(f59e0bff) rgba(a855f7ff) 45deg
$glow_carrera      = rgba(fbbf2455)

# [Preset 8] Primordial Violet: Ultima (Mystic Violet -> Abyssal Purple -> Toxic Cyan)
$border_ultima     = rgba(c084fcff) rgba(7c3aedff) rgba(10b981ff) 45deg
$glow_ultima       = rgba(c084fc55)

# [Preset 9] Demon Primordial: Mustang (Onyx Flame -> Copper Orange -> Gold)
$border_mustang    = rgba(f97316ff) rgba(ea580cff) rgba(ffd54fff) 45deg
$glow_mustang      = rgba(f9731655)

# ─── Active Theme Selection (Modified by hyprslime-theme / installer) ─────────
$active_border    = $border_hellflare
$slime_glow       = $glow_hellflare
$inactive_border  = $bg_inactive

