# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Dynamic Caelestia Special Workspaces (conf/special.conf)
# ══════════════════════════════════════════════════════════════════════════════

bind = SUPER, S, exec, ~/.config/hypr/scripts/special-ws.sh toggle 'music'
windowrulev2 = workspace special:music, class:^(Spotify|spotify)$
bind = SUPER, Escape, exec, ~/.config/hypr/scripts/special-ws.sh toggle 'sysmon'
windowrulev2 = workspace special:sysmon, class:^(sysmon-btop)$
bind = SUPER, D, exec, ~/.config/hypr/scripts/special-ws.sh toggle 'chat'
windowrulev2 = workspace special:chat, class:^(discord|vesktop|WebCord)$
bind = SUPER, B, exec, ~/.config/hypr/scripts/special-ws.sh toggle 'browser'
windowrulev2 = workspace special:browser, class:^(brave-browser|Brave-browser|firefox)$
