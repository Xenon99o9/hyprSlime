# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Default Applications & Commands (programs.conf)
#  Note: Can be customized interactively during installation (install.sh)
# ══════════════════════════════════════════════════════════════════════════════

$terminal    = kitty
$fileManager = thunar
$browser     = brave
$editor      = code

# Great Sage Shell (Quickshell) & Launcher
$shell       = quickshell
$menu        = rofi -show drun
# Once the Quickshell Great Sage launcher module is active, you can switch to:
# $menu      = quickshell ipc call launcher toggle

# Utilities
$lock        = hyprlock
$reload_wall = swww img ~/.config/hypr/wallpapers/default.webp --transition-type wave --transition-fps 120

