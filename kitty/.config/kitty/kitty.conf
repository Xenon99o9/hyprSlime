# ══════════════════════════════════════════════════════════════════════════════
#  HYPRSLIME — Great Sage Terminal Interface (kitty.conf)
# ══════════════════════════════════════════════════════════════════════════════

# ─── Typography ───────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ─── Window & Holographic Transparency ────────────────────────────────────────
window_padding_width 12
background_opacity   0.85
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no

# ─── Slime Fluid Cursor Trail (Kitty 0.37+) ───────────────────────────────────
cursor_shape     beam
cursor_beam_thickness 2.0
cursor_trail     1
cursor_trail_decay 0.1 0.35

# ─── Tab Bar (Geometric HUD Style) ────────────────────────────────────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #080c14
active_tab_background   #00e5ff
active_tab_font_style   bold
inactive_tab_foreground #8ab4f8
inactive_tab_background #0f1726

# ─── Great Sage & Rimuru Color Scheme (Abyssal Mindscape) ─────────────────────
foreground              #e2f1ff
background              #080c14
selection_foreground    #080c14
selection_background    #00e5ff

# Golden Eye Cursor
cursor                  #ffd54f
cursor_text_color       #080c14
url_color               #00e5ff

# Black (Void)
color0  #0d1321
color8  #2b3a55

# Red (Benimaru Crimson)
color1  #ff5252
color9  #ff867f

# Green (Recovery Potion / Dryad Emerald)
color2  #00e676
color10 #69f0ae

# Yellow (Great Sage Gold)
color3  #ffd54f
color11 #ffe57f

# Blue (Rimuru Core Azure)
color4  #2979ff
color12 #82b1ff

# Magenta (Beelzebub / Shion Violet)
color5  #b388ff
color13 #d1c4e9

# Cyan (Magicule Glow)
color6  #00e5ff
color14 #84ffff

# White (Ice Silver)
color7  #cfe8ff
color15 #ffffff

